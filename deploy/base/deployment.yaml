apiVersion: apps/v1
kind: Deployment
metadata:
  name: velero-retention-controller
spec:
  replicas: 1
  strategy:
    # Leader election is enabled, but Recreate also keeps a rollout from
    # briefly running two managers that would fight over the lease.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: velero-retention-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: velero-retention-controller
    spec:
      serviceAccountName: velero-retention-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: manager
          image: ghcr.io/ivanboykov/velero-retention-controller:v0.2.0
          env:
            # Single-namespace scope: the Role, the cache and leader election all
            # follow the namespace the controller is deployed into.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Soft limit: keep the Go heap below the hard cgroup limit so normal
            # allocation stays GC pressure, not an OOMKill. Go 1.27 also clamps
            # GOMAXPROCS to the cgroup CPU quota by default (containermaxprocs=1).
            - name: GOMEMLIMIT
              value: "90MiB"
          args:
            - -metrics-bind-address=:8080
            - -health-probe-bind-address=:8081
            - -leader-elect=true
            # Global dry-run kill switch. "-dry-run=false" enables writes only
            # for Schedules annotated with retention.velero.io/enforce: "true".
            - -dry-run=true
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          # Sized from a measured footprint of ~2 KiB per cached Backup CR: 128Mi
          # covers 10k backups ~20Mi + ~40Mi runtime baseline, doubled against GC
          # spikes. GOMEMLIMIT (90MiB) is the limit minus the non-heap headroom
          # the Go docs recommend. Raise if you cache far more backups per schedule.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
